<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d140d;overflow:hidden;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:#fff;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.px{font-family:'Press Start 2P','Courier New',monospace;letter-spacing:.5px}
.hide{display:none!important}
/* --- buttons --- */
.btn{display:block;width:100%;margin:8px 0;padding:13px 16px;font:800 15px/1.1 'Trebuchet MS',system-ui,sans-serif;color:#fff;text-shadow:0 2px 0 #0007;text-align:center;cursor:pointer;background:linear-gradient(#8a8a8a,#6c6c6c);border:3px solid;border-color:#d4d4d4 #343434 #343434 #d4d4d4;border-radius:3px;box-shadow:0 3px 0 #222}
.btn:hover,.btn:focus{background:linear-gradient(#7d9a58,#5e7d3c);border-color:#d7f0b0 #2f4a1c #2f4a1c #d7f0b0;outline:0}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #222}
.btn.green{background:linear-gradient(#6fbf4a,#3f8a2c);border-color:#c9f5a8 #1f4a14 #1f4a14 #c9f5a8}.btn.green:hover{background:linear-gradient(#85d65e,#4aa035)}
.btn.red{background:linear-gradient(#cf5a4a,#8f2e24);border-color:#f5b5a8 #4a140f #4a140f #f5b5a8}
.btn.sm{display:inline-block;width:auto;margin:3px;padding:7px 12px;font-size:13px}.btn[disabled]{opacity:.45;pointer-events:none}
/* --- title screen --- */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:radial-gradient(ellipse at 50% 35%,#0000 0%,#0a160866 75%),linear-gradient(#0002,#0007);z-index:20;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
#title .top{width:100%;max-width:560px;text-align:center;margin-top:3vh}
.logo{font-size:min(11vw,64px);line-height:1.15;margin:0;color:#ffd84a;text-shadow:0 1px 0 #d89a1a,0 2px 0 #c98a14,0 3px 0 #b97a10,0 4px 0 #a46a0c,0 5px 0 #8f5a08,0 6px 0 #7a4a06,0 8px 10px #000a;transform:rotate(-1.5deg)}
.logo span{color:#7fe05a;text-shadow:0 1px 0 #4aa032,0 2px 0 #3f8a2c,0 3px 0 #337624,0 4px 0 #2a641c,0 5px 0 #215216,0 6px 0 #18400f,0 8px 10px #000a}
.tag{margin:14px 0 0;font-size:min(3.4vw,14px);color:#e8f5d8;text-shadow:0 2px 0 #000a;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) scale(1.03)}}
#title .mid{width:100%;max-width:420px;max-height:50vh;overflow:auto;padding:4px}
#title .foot,.foot{width:100%;text-align:center;padding:10px 0 8px;font-size:13px;color:#d8e8c8;text-shadow:0 2px 0 #000b;letter-spacing:.4px}
.foot b{color:#ffd84a}
.worlds{margin:6px 0}
.wrow{display:flex;align-items:center;gap:8px;background:#0008;border:2px solid #6a6a6a;border-radius:4px;padding:8px 10px;margin:6px 0}
.wrow .nm{flex:1;min-width:0;font-weight:800}.wrow .nm small{display:block;font-weight:400;color:#bcd0a8;font-size:12px;margin-top:2px}
/* --- panels --- */
#panel{position:fixed;inset:0;z-index:15;background:#000a;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
.win{background:linear-gradient(#37302a,#2a2520);border:4px solid #8b6b3d;border-radius:6px;box-shadow:0 0 0 3px #1a1510,0 12px 40px #000c;max-height:94vh;max-width:min(960px,98vw);width:100%;display:flex;flex-direction:column;overflow:hidden}
.win .hd{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#00000040;border-bottom:3px solid #1a1510;flex-wrap:wrap}
.win .hd h2{margin:0;font-size:16px;flex:1;min-width:120px;color:#ffd84a}
.win .bd{padding:10px;overflow:auto;flex:1}
.tabs{display:flex;gap:4px}.tab{padding:7px 11px;font-weight:800;font-size:13px;background:#4a4238;border:2px solid #6a5c48;border-radius:4px;cursor:pointer;color:#e8d8c0}.tab.on{background:#8b6b3d;color:#fff;border-color:#c9a45a}
.cols{display:flex;gap:12px;align-items:flex-start}
.craftcol{flex:1.15;min-width:0}.invcol{flex:1;min-width:0}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}.chip{padding:4px 9px;font-size:12px;font-weight:800;background:#4a4238;border:2px solid #6a5c48;border-radius:12px;cursor:pointer}.chip.on{background:#7a9a4a;border-color:#c8f08a}
#recipes{max-height:min(54vh,430px);overflow:auto;padding-right:3px}
.rcp{display:flex;align-items:center;gap:8px;padding:6px 8px;margin:4px 0;background:#00000038;border:2px solid #4a4238;border-radius:4px}.rcp.ok{border-color:#6fae48;background:#1c3a1448}
.rcp .ic{width:40px;height:40px;flex:none;image-rendering:pixelated}.rcp .tx{flex:1;min-width:0;font-size:13px}.rcp .tx b{display:block;font-size:14px}
.ing{display:inline-flex;align-items:center;margin:1px 6px 1px 0;font-size:12px}.ing img{width:18px;height:18px;image-rendering:pixelated;margin-right:2px}.ing.no{color:#ff8a7a}.ing.yes{color:#a8f08a}
.stn{font-size:11px;color:#ffcf6a}
.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin:4px 0}
.slot{aspect-ratio:1;background:#1c1914;border:2px solid;border-color:#0c0a08 #5c5246 #5c5246 #0c0a08;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:0}
.slot:hover{background:#3a3428;outline:2px solid #ffd84a;outline-offset:-2px}.slot.sel{outline:3px solid #fff;outline-offset:-3px}
.slot img{width:78%;height:78%;image-rendering:pixelated;pointer-events:none}
.slot b{position:absolute;right:2px;bottom:0;font-size:12px;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;pointer-events:none}
.slot i{position:absolute;left:3px;right:3px;bottom:2px;height:3px;background:#000;pointer-events:none}.slot i u{display:block;height:100%}
.lbl{font-size:12px;color:#c8b898;margin:8px 0 2px;font-weight:800;letter-spacing:.6px}
#cursorItem{position:fixed;width:44px;height:44px;pointer-events:none;z-index:40;image-rendering:pixelated}#cursorItem img{width:100%;height:100%;image-rendering:pixelated}#cursorItem b{position:absolute;right:0;bottom:-2px;font-size:13px;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
.qrow{padding:9px 11px;margin:6px 0;background:#00000038;border:2px solid #4a4238;border-radius:4px}.qrow.cur{border-color:#ffd84a;background:#4a3a1a55}.qrow.done{opacity:.55}.qrow b{color:#ffd84a}
.bar{height:10px;background:#000a;border:2px solid #1a1510;border-radius:3px;margin:5px 0;overflow:hidden}.bar u{display:block;height:100%;background:linear-gradient(#8fe05a,#4aa032)}
.chk{margin:3px 0;font-size:14px}.chk.ok{color:#a8f08a}.chk.no{color:#ff9a8a}
.set{display:flex;align-items:center;gap:10px;margin:10px 0}.set label{flex:1;font-weight:700;font-size:14px}.set input[type=range]{flex:1.2}.set input[type=text]{flex:1.4;padding:8px;font:700 14px system-ui;border:2px solid #6a5c48;background:#1c1914;color:#fff;border-radius:3px}
.seg{display:flex;gap:4px}.seg .btn{margin:0;padding:8px 10px;font-size:13px}.seg .btn.on{background:linear-gradient(#6fbf4a,#3f8a2c)}
/* --- HUD --- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;mix-blend-mode:difference}
#cross:before,#cross:after{content:'';position:absolute;background:#fff}#cross:before{left:10px;top:3px;width:2px;height:16px}#cross:after{top:10px;left:3px;height:2px;width:16px}
#hotbar{position:absolute;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:3px;background:#000a;border:3px solid #1a1510;border-radius:4px;padding:3px;pointer-events:auto}
#hotbar .slot{width:var(--hs,50px);aspect-ratio:1;flex:none}
#stats{position:absolute;left:50%;bottom:calc(var(--hs,50px) + 24px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(var(--hs,50px)*9 + 32px);display:flex;justify-content:space-between;align-items:flex-end}
.row{display:flex;gap:1px}.row i{width:calc(var(--hs,50px)*.2);height:calc(var(--hs,50px)*.2);background-size:100% 100%;image-rendering:pixelated}
#air{position:absolute;left:50%;bottom:calc(var(--hs,50px) + 24px + var(--hs,50px)*.3 + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;justify-content:flex-end;width:calc(var(--hs,50px)*9 + 32px)}
#heldname{position:absolute;left:50%;bottom:calc(var(--hs,50px)*1.6 + 52px + env(safe-area-inset-bottom));transform:translateX(-50%);font-weight:800;text-shadow:0 2px 0 #000,0 0 6px #000;transition:opacity .4s;white-space:nowrap}
#toasts{position:absolute;left:50%;top:12%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:92%;pointer-events:none}
.toast{background:#000b;border:2px solid #ffffff55;padding:6px 12px;border-radius:4px;font-weight:700;font-size:14px;text-align:center;animation:tin .25s;max-width:100%}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#picks{position:absolute;left:10px;bottom:calc(var(--hs,50px)*1.2 + 70px);display:flex;flex-direction:column;gap:3px;align-items:flex-start;font-size:13px;font-weight:800}
#picks div{background:#0008;padding:2px 8px;border-radius:3px;display:flex;align-items:center;gap:5px;animation:tin .2s}#picks img{width:20px;height:20px;image-rendering:pixelated}
#big{position:absolute;left:0;right:0;top:20%;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
#big.on{opacity:1}#big h1{margin:0;font-size:min(7vw,38px);color:#ffd84a;text-shadow:0 3px 0 #7a4a06,0 0 18px #000}#big p{margin:6px 0;font-size:min(4vw,20px);text-shadow:0 2px 0 #000}
#qtrack{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top));width:min(260px,44vw);background:#000a;border:2px solid #ffffff44;border-radius:5px;padding:8px 10px;font-size:12px;line-height:1.35;pointer-events:auto;cursor:pointer}
#qtrack b{color:#ffd84a;font-size:13px;display:block;margin-bottom:2px}#qtrack .bar{height:7px;margin:4px 0 0}
#wp{position:absolute;left:0;top:0;transform:translate(-50%,-50%);text-align:center;font-weight:800;font-size:12px;text-shadow:0 2px 0 #000,0 0 5px #000;pointer-events:none}
#wp i{display:block;width:14px;height:14px;margin:0 auto 2px;transform:rotate(45deg);border:2px solid #fff;box-shadow:0 0 8px #000}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 30px #d00;opacity:0}
#sleepov{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:6}
#dbg{position:absolute;left:8px;top:8px;font:12px/1.35 monospace;background:#0008;padding:6px 8px;white-space:pre;border-radius:3px;display:none}
#death{position:fixed;inset:0;z-index:30;background:radial-gradient(#6a0a0a99,#1a0000ee);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
#death h1{font-size:min(8vw,44px);color:#ff6a5a;text-shadow:0 4px 0 #3a0a0a;margin:0}#death p{font-size:18px;margin:8px 0 18px}#death .btn{max-width:300px}
/* --- touch --- */
#touch{position:fixed;inset:0;z-index:4;pointer-events:none}
#joy{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:calc(var(--ts,56px) + 78px + env(safe-area-inset-bottom));width:150px;height:150px;pointer-events:auto;touch-action:none}
#joy .ring{position:absolute;inset:0;border-radius:50%;background:#ffffff18;border:3px solid #ffffff55}#joy .knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:#ffffff66;border:3px solid #fff9}
#lookz{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:auto;touch-action:none}
.tb{position:absolute;width:62px;height:62px;border-radius:50%;background:#00000066;border:3px solid #ffffff77;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;text-shadow:0 2px 3px #000}.tb.on{background:#ffd84a99}.tb small{position:absolute;bottom:-14px;font-size:10px;font-weight:800;text-shadow:0 1px 2px #000}
.tb.sq{border-radius:12px;width:48px;height:48px;font-size:22px}
@media (max-width:760px){.cols{flex-direction:column}.craftcol,.invcol{width:100%;flex:none}#recipes{max-height:34vh}.win .bd{padding:8px}}


/* ---- Bild House (low-poly) HUD ---- */
#res{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:4px;max-width:min(430px,56vw);pointer-events:none}
#res span{background:#000a;border:2px solid #ffffff33;border-radius:4px;padding:2px 7px;font-weight:800;font-size:13px;display:flex;gap:4px;align-items:center}

#bars{position:absolute;left:50%;bottom:calc(var(--ts,56px) + 22px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(340px,86vw);display:flex;flex-direction:column;gap:3px}
.b{height:13px;background:#000a;border:2px solid #1a1510;border-radius:7px;overflow:hidden;position:relative}.b u{display:block;height:100%;transition:width .15s}.b i{position:absolute;left:8px;top:-1px;font-size:10px;font-style:normal;font-weight:800;text-shadow:0 1px 1px #000}
.hp u{background:linear-gradient(#ff7a6a,#d82e2e)}.hu u{background:linear-gradient(#ffc36a,#e07a1c)}.st u{background:linear-gradient(#8ad8ff,#2f86d8)}
#tools{position:absolute;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;background:#000a;border:3px solid #1a1510;border-radius:6px;padding:4px;pointer-events:auto}
.tl{width:var(--ts,56px);height:var(--ts,56px);background:#1c1914;border:2px solid;border-color:#0c0a08 #5c5246 #5c5246 #0c0a08;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:calc(var(--ts,56px)*.46);cursor:pointer;position:relative}.tl.sel{outline:3px solid #ffd84a;outline-offset:-3px;background:#3a3428}.tl.off{opacity:.35}.tl small{position:absolute;bottom:1px;right:4px;font-size:11px;font-weight:800;text-shadow:0 1px 1px #000}.tl em{position:absolute;top:1px;left:4px;font-size:10px;font-style:normal;font-weight:800;color:#ffd84a}
#prompt{position:absolute;left:50%;bottom:calc(var(--ts,56px) + 80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000b;border:2px solid #ffd84a;border-radius:20px;padding:6px 16px;font-weight:800;font-size:14px;white-space:nowrap;pointer-events:none;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.row2{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}.cost{display:inline-flex;gap:3px;align-items:center;background:#0006;border-radius:4px;padding:1px 6px;margin:1px 3px 1px 0;font-size:13px;font-weight:700}.cost.no{color:#ff9a8a}.cost.yes{color:#a8f08a}
.stage{display:flex;gap:10px;align-items:center;padding:8px 10px;margin:5px 0;background:#00000038;border:2px solid #4a4238;border-radius:5px}.stage.done{opacity:.6;border-color:#6fae48}.stage.next{border-color:#ffd84a;background:#4a3a1a55}.stage .no{width:28px;height:28px;border-radius:50%;background:#4a4238;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}.stage.done .no{background:#6fae48}.stage .tx{flex:1;font-size:13px}.stage .tx b{font-size:14px;color:#ffd84a;display:block}
#touch .tb.act{width:76px;height:76px;font-size:30px}

.tb.sq{top:calc(46px + env(safe-area-inset-top))}
@media (max-width:620px){
 #res{max-width:calc(100vw - 20px)} #res span{font-size:12px;padding:1px 5px}
 #clock{left:auto;right:8px;top:calc(8px + env(safe-area-inset-top));transform:none;font-size:11px;padding:2px 8px}
 #qtrack{top:calc(38px + env(safe-area-inset-top));width:42vw;font-size:11px;padding:6px 8px;max-height:112px;overflow:hidden}
 .tb.sq{top:calc(84px + env(safe-area-inset-top));width:44px;height:44px;font-size:19px}
 #bars{width:min(300px,64vw)}
}
@media (max-height:520px) and (min-width:621px){ #qtrack{width:30vw;font-size:11px} }
</style></head>
