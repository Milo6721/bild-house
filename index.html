<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#c8102e">
<title>Strona zamknięta</title>
<style>
  :root {
    --red: #c8102e;
    --red-deep: #8f0a20;
    --paper: #fff4ee;
    --ink: #2a0008;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(ellipse at 50% 38%, #e4152f 0%, var(--red) 46%, var(--red-deep) 100%);
    color: var(--paper);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* barrier tape: the one memorable element */
  .tape {
    height: clamp(26px, 5vh, 44px);
    background: repeating-linear-gradient(-45deg, var(--ink) 0 26px, var(--paper) 26px 52px);
    box-shadow: 0 4px 0 rgba(0, 0, 0, .25);
    flex: none;
  }
  .tape.bottom { box-shadow: 0 -4px 0 rgba(0, 0, 0, .25); }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(24px, 6vw, 72px);
    gap: clamp(18px, 3.5vw, 34px);
  }
  .lock {
    width: clamp(72px, 14vw, 128px);
    height: auto;
    filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .28));
  }
  h1 {
    margin: 0;
    font-family: Impact, "Haettenschweiler", "Arial Narrow Bold", "Arial Black", sans-serif;
    font-weight: 900;
    font-size: clamp(2.6rem, 9.5vw, 7.2rem);
    line-height: .98;
    letter-spacing: .01em;
    max-width: 14ch;
    text-wrap: balance;
    text-shadow: 0 5px 0 rgba(0, 0, 0, .28);
  }
  p {
    margin: 0;
    max-width: 34ch;
    font-size: clamp(1.1rem, 2.6vw, 1.7rem);
    line-height: 1.45;
    font-weight: 600;
    text-wrap: balance;
  }
  footer {
    flex: none;
    padding: 14px 16px 20px;
    text-align: center;
    font-size: .9rem;
    color: rgba(255, 244, 238, .78);
  }
  footer b { color: var(--paper); }
  a:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
</style>
</head>
<body>
  <div class="tape" aria-hidden="true"></div>
  <main>
    <svg class="lock" viewBox="0 0 120 140" role="img" aria-label="Zamknięta kłódka">
      <path d="M32 62V42a28 28 0 0 1 56 0v20" fill="none" stroke="#fff4ee" stroke-width="12" stroke-linecap="round"/>
      <rect x="14" y="60" width="92" height="72" rx="10" fill="#fff4ee"/>
      <circle cx="60" cy="92" r="9" fill="#c8102e"/>
      <rect x="55" y="96" width="10" height="22" rx="4" fill="#c8102e"/>
    </svg>
    <h1>Ta strona została zamknięta</h1>
    <p>z powodu drwin użytkowników.</p>
  </main>
  <div class="tape bottom" aria-hidden="true"></div>
  <footer><b>Miłosz Games Inc.</b> &copy; 2026</footer>
</body>
</html>
